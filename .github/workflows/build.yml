name: Build

on:
  push:
    branches: master
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .[test]

        # pytest -vv -r ap --cov galaxalabs_jupyterlab_steel_dark_theme

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "galaxalabs_jupyterlab_steel_dark_theme.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "galaxalabs_jupyterlab_steel_dark_theme" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: extension-artifacts
        path: dist/galaxalabs_jupyterlab_steel_dark_theme*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" galaxalabs_jupyterlab_steel_dark_theme*.whl

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "galaxalabs_jupyterlab_steel_dark_theme.*OK"
        python -m jupyterlab.browser_check --no-browser-test
